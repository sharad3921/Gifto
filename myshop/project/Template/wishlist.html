{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding:40px 20px;max-width:1000px;">
  <h2>Your Wishlist</h2>
  {% if products %}
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; margin-top:20px;">
      {% for p in products %}
      <div style="background:#fff;padding:14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.04);">
        {% if p.image %}
          <img src="{{ p.image.url }}" alt="{{ p.Name }}" style="width:100%;height:150px;object-fit:cover;border-radius:6px;" />
        {% endif %}
        <h4 style="margin:10px 0 6px;">{{ p.Name }}</h4>
        <p style="color:#f05f2e;font-weight:700;">{{ p.Price }}</p>
        <a href="{% url 'product_detail' p.pk %}" class="btn btn-sm btn-primary">View</a>
        <a href="{% url 'wishlist_toggle' p.pk %}" class="btn btn-sm btn-outline-secondary">Remove</a>
      </div>
      {% endfor %}
    </div>
  {% else %}
    <p style="color:#777;margin-top:18px;">Your wishlist is empty.</p>
  {% endif %}
</div>
{% endblock %}

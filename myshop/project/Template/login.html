{% extends "base.html" %}
{% load static %}
{% block content %}

<style>
  .auth-wrapper {
    min-height: 82vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 40px 20px;
  }
  .auth-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    color: #fff;
  }
  .auth-logo {
    font-size: 2.2rem;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #f05f2e, #f5a623);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }
  .auth-subtitle {
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 0.95rem;
    margin-bottom: 36px;
  }
  .auth-label {
    color: rgba(255,255,255,0.8);
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .auth-input {
    background: rgba(255,255,255,0.08) !important;
    border: 1.5px solid rgba(255,255,255,0.15) !important;
    border-radius: 12px !important;
    color: #fff !important;
    padding: 13px 16px !important;
    font-size: 0.97rem !important;
    transition: border-color 0.2s, box-shadow 0.2s !important;
  }
  .auth-input:focus {
    border-color: #f5a623 !important;
    box-shadow: 0 0 0 3px rgba(245,166,35,0.18) !important;
    background: rgba(255,255,255,0.12) !important;
  }
  .auth-input::placeholder { color: rgba(255,255,255,0.35) !important; }
  .auth-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #f05f2e, #f5a623);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 8px;
  }
  .auth-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(240,95,46,0.45);
  }
  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: rgba(255,255,255,0.3);
    font-size: 0.85rem;
  }
  .auth-divider::before, .auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.12);
  }
  .auth-link {
    display: block;
    text-align: center;
    color: #f5a623;
    font-weight: 600;
    text-decoration: none;
    font-size: 0.95rem;
    transition: color 0.2s;
  }
  .auth-link:hover { color: #f05f2e; text-decoration: none; }
  .auth-footer {
    text-align: center;
    margin-top: 28px;
    color: rgba(255,255,255,0.45);
    font-size: 0.9rem;
  }
  .auth-footer a { color: #f5a623; font-weight: 600; text-decoration: none; }
  .form-check-label { color: rgba(255,255,255,0.6); font-size: 0.9rem; cursor: pointer; }
  .form-check-input { margin-top: 3px; }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🎁 Giftos</div>
    <div class="auth-subtitle">Welcome back! Sign in to your account</div>

    <form action="" method="POST" novalidate>
      {% csrf_token %}

      <div class="form-group mb-3">
        <label class="auth-label">Username</label>
        <input type="text" class="form-control auth-input" name="username"
               placeholder="Enter your username" autocomplete="username" required>
      </div>

      <div class="form-group mb-3">
        <label class="auth-label">Password</label>
        <input type="password" class="form-control auth-input" name="password"
               placeholder="Enter your password" autocomplete="current-password" required>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="{% url 'reset_password' %}" style="color:#f5a623; font-size:0.88rem; text-decoration:none; font-weight:600;">
          Forgot password?
        </a>
      </div>

      <button type="submit" class="auth-btn">Sign In →</button>
    </form>

    <div class="auth-divider">or</div>
    <a href="{% url 'register' %}" class="auth-link">Create a new account</a>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Register free</a>
    </div>
  </div>
</div>

{% endblock content %}
